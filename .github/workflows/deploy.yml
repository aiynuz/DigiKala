name: Deploy Vite App

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write


jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20


      - name: Install dependencies
        run: npm install
        working-directory: frontend


      - name: Build
        run: npm run build
        working-directory: frontend


      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist



  deploy:

    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}


    steps:

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4